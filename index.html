<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Word & PDF Converter</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      padding: 22px 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      font-size: 27px;
      margin-bottom: 7px;
    }

    header p {
      color: #666;
      font-size: 15px;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 35px auto;
    }

    .converter {
      background: white;
      padding: 28px 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .tabs {
      display: flex;
      width: 100%;
      background: #eeeeee;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      border: none;
      padding: 14px 8px;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      color: #555;
    }

    .tab.active {
      background: #ffffff;
      color: #5c2dc7;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .converter-title {
      text-align: center;
      font-size: 23px;
      margin-bottom: 8px;
    }

    .converter-description {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
      line-height: 1.5;
    }

    .upload-area {
      border: 2px dashed #bbb;
      padding: 35px 15px;
      text-align: center;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-area:hover {
      border-color: #5c2dc7;
      background: #faf8ff;
    }

    .upload-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .upload-area h3 {
      margin-bottom: 8px;
    }

    .upload-area p {
      font-size: 14px;
      color: #777;
    }

    #fileInput {
      display: none;
    }

    .choose-button {
      display: inline-block;
      background: #5c2dc7;
      color: white;
      padding: 11px 20px;
      border-radius: 8px;
      margin-top: 18px;
      font-size: 15px;
      font-weight: bold;
    }

    .file-info {
      margin-top: 20px;
      padding: 14px;
      background: #f4f4f4;
      border-radius: 9px;
      display: none;
      word-break: break-word;
      font-size: 14px;
    }

    .convert-button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #5c2dc7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .convert-button:hover {
      background: #4921a5;
    }

    .convert-button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      min-height: 22px;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #138a36;
    }

    .loading {
      color: #555;
    }

    footer {
      text-align: center;
      color: #888;
      padding: 30px 15px;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .container {
        width: 94%;
        margin-top: 20px;
      }

      .converter {
        padding: 20px 15px;
      }

      .tab {
        font-size: 14px;
      }

      header h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Word & PDF Converter</h1>
  <p>Quickly convert Word documents and PDF files.</p>
</header>

<main class="container">

  <div class="converter">

    <!-- TABS -->
    <div class="tabs">
      <button
        type="button"
        id="wordToPdfTab"
        class="tab active">
        Word → PDF
      </button>

      <button
        type="button"
        id="pdfToWordTab"
        class="tab">
        PDF → Word
      </button>
    </div>

    <!-- TITLE -->
    <h2
      id="converterTitle"
      class="converter-title">
      Word to PDF
    </h2>

    <!-- DESCRIPTION -->
    <p
      id="converterDescription"
      class="converter-description">
      Upload a Word document and convert it to PDF.
    </p>

    <!-- UPLOAD BOX -->
    <div
      id="uploadArea"
      class="upload-area">

      <div class="upload-icon">📄</div>

      <h3 id="uploadTitle">
        Choose a Word document
      </h3>

      <p id="uploadDescription">
        DOC or DOCX files
      </p>

      <span class="choose-button">
        Choose File
      </span>

      <input
        type="file"
        id="fileInput"
        accept=".doc,.docx">
    </div>

    <!-- SELECTED FILE -->
    <div
      id="fileInfo"
      class="file-info">
    </div>

    <!-- CONVERT -->
    <button
      id="convertButton"
      class="convert-button"
      type="button"
      disabled>
      Convert to PDF
    </button>

    <!-- STATUS -->
    <div
      id="status"
      class="status">
    </div>

  </div>

</main>

<footer>
  Word & PDF Converter
</footer>


<script>

  /* =========================================
     SETTINGS
     ========================================= */

  let conversionMode = "word-to-pdf";

  const wordToPdfEndpoint = "/convert-word-to-pdf";
  const pdfToWordEndpoint = "/convert-pdf-to-word";


  /* =========================================
     ELEMENTS
     ========================================= */

  const wordToPdfTab =
    document.getElementById("wordToPdfTab");

  const pdfToWordTab =
    document.getElementById("pdfToWordTab");

  const converterTitle =
    document.getElementById("converterTitle");

  const converterDescription =
    document.getElementById("converterDescription");

  const uploadArea =
    document.getElementById("uploadArea");

  const uploadTitle =
    document.getElementById("uploadTitle");

  const uploadDescription =
    document.getElementById("uploadDescription");

  const fileInput =
    document.getElementById("fileInput");

  const fileInfo =
    document.getElementById("fileInfo");

  const convertButton =
    document.getElementById("convertButton");

  const status =
    document.getElementById("status");


  /* =========================================
     WORD → PDF TAB
     ========================================= */

  wordToPdfTab.addEventListener("click", function () {

    conversionMode = "word-to-pdf";

    wordToPdfTab.classList.add("active");
    pdfToWordTab.classList.remove("active");

    converterTitle.textContent =
      "Word to PDF";

    converterDescription.textContent =
      "Upload a Word document and convert it to PDF.";

    uploadTitle.textContent =
      "Choose a Word document";

    uploadDescription.textContent =
      "DOC or DOCX files";

    fileInput.accept =
      ".doc,.docx";

    convertButton.textContent =
      "Convert to PDF";

    resetFile();

  });


  /* =========================================
     PDF → WORD TAB
     ========================================= */

  pdfToWordTab.addEventListener("click", function () {

    conversionMode = "pdf-to-word";

    pdfToWordTab.classList.add("active");
    wordToPdfTab.classList.remove("active");

    converterTitle.textContent =
      "PDF to Word";

    converterDescription.textContent =
      "Upload a PDF file and convert it to an editable Word document.";

    uploadTitle.textContent =
      "Choose a PDF file";

    uploadDescription.textContent =
      "PDF files";

    fileInput.accept =
      ".pdf,application/pdf";

    convertButton.textContent =
      "Convert to Word";

    resetFile();

  });


  /* =========================================
     OPEN FILE SELECTOR
     ========================================= */

  uploadArea.addEventListener("click", function () {

    fileInput.click();

  });


  /* =========================================
     FILE SELECTED
     ========================================= */

  fileInput.addEventListener("change", function () {

    status.textContent = "";
    status.className = "status";

    if (!fileInput.files.length) {
      resetFile();
      return;
    }

    const file = fileInput.files[0];

    const filename =
      file.name.toLowerCase();

    if (
      conversionMode === "word-to-pdf" &&
      !filename.endsWith(".doc") &&
      !filename.endsWith(".docx")
    ) {

      showError(
        "Please choose a DOC or DOCX file."
      );

      resetFile();

      return;
    }

    if (
      conversionMode === "pdf-to-word" &&
      !filename.endsWith(".pdf")
    ) {

      showError(
        "Please choose a PDF file."
      );

      resetFile();

      return;
    }

    fileInfo.style.display =
      "block";

    fileInfo.textContent =
      "Selected file: " + file.name;

    convertButton.disabled =
      false;

  });


  /* =========================================
     CONVERT FILE
     ========================================= */

  convertButton.addEventListener(
    "click",
    async function () {

      if (!fileInput.files.length) {
        showError("Please choose a file first.");
        return;
      }

      const file =
        fileInput.files[0];

      const formData =
        new FormData();

      formData.append(
        "file",
        file
      );

      let endpoint;

      if (
        conversionMode ===
        "word-to-pdf"
      ) {

        endpoint =
          wordToPdfEndpoint;

      } else {

        endpoint =
          pdfToWordEndpoint;

      }

      convertButton.disabled =
        true;

      status.className =
        "status loading";

      status.textContent =
        "Converting... Please wait.";

      try {

        const response =
          await fetch(endpoint, {

            method: "POST",

            body: formData

          });


        /* ERROR FROM SERVER */

        if (!response.ok) {

          let errorMessage =
            "Conversion failed.";

          try {

            const errorData =
              await response.json();

            if (errorData.error) {

              errorMessage =
                errorData.error;

            }

          } catch (error) {

            const text =
              await response.text();

            if (text) {

              errorMessage =
                text;

            }

          }

          throw new Error(
            errorMessage
          );

        }


        /* GET CONVERTED FILE */

        const blob =
          await response.blob();


        /* FILE NAME */

        let downloadName;

        if (
          conversionMode ===
          "word-to-pdf"
        ) {

          downloadName =
            file.name.replace(
              /\.(doc|docx)$/i,
              ""
            ) + ".pdf";

        } else {

          downloadName =
            file.name.replace(
              /\.pdf$/i,
              ""
            ) + ".docx";

        }


        /* DOWNLOAD */

        const downloadUrl =
          window.URL.createObjectURL(
            blob
          );

        const downloadLink =
          document.createElement("a");

        downloadLink.href =
          downloadUrl;

        downloadLink.download =
          downloadName;

        document.body.appendChild(
          downloadLink
        );

        downloadLink.click();

        downloadLink.remove();

        window.URL.revokeObjectURL(
          downloadUrl
        );


        status.className =
          "status success";

        status.textContent =
          "Conversion complete!";


      } catch (error) {

        console.error(error);

        status.className =
          "status error";

        status.textContent =
          error.message ||
          "Something went wrong.";

      } finally {

        convertButton.disabled =
          false;

      }

    }
  );


  /* =========================================
     RESET
     ========================================= */

  function resetFile() {

    fileInput.value =
      "";

    fileInfo.style.display =
      "none";

    fileInfo.textContent =
      "";

    convertButton.disabled =
      true;

    status.textContent =
      "";

    status.className =
      "status";

  }


  /* =========================================
     ERROR
     ========================================= */

  function showError(message) {

    status.className =
      "status error";

    status.textContent =
      message;

  }

</script>

</body>
</html>

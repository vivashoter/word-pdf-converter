<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PDF Editor | WordPDF</title>

  <link rel="stylesheet" href="editor.css">
</head>

<body>

  <header class="editor-header">

    <div class="brand">
      <span class="brand-icon">↔</span>
      WordPDF
    </div>

    <div class="document-name" id="documentName">
      Converted Document.pdf
    </div>

    <div class="header-actions">
      <button id="emailButton">Email</button>
      <button id="printButton">Print</button>
      <button id="downloadButton" class="primary-button">
        Download
      </button>
    </div>

  </header>


  <div class="editor-layout">

    <aside class="toolbar">

      <button class="tool-button" data-tool="select">
        <span>↖</span>
        Select
      </button>

      <button class="tool-button" data-tool="text">
        <span>T</span>
        Text
      </button>

      <button class="tool-button" data-tool="draw">
        <span>✎</span>
        Draw
      </button>

      <button class="tool-button" data-tool="highlight">
        <span>▰</span>
        Highlight
      </button>

      <button class="tool-button" data-tool="image">
        <span>▧</span>
        Image
      </button>

      <button class="tool-button" data-tool="sign">
        <span>✍</span>
        Sign
      </button>

    </aside>


    <main class="document-workspace">

      <div class="document-controls">

        <button id="zoomOut">−</button>

        <span id="zoomLevel">
          100%
        </span>

        <button id="zoomIn">+</button>

      </div>


      <div class="pdf-container">

        <div id="pdfViewer" class="pdf-viewer">

          <div class="empty-preview" id="loadingMessage">

            <div class="document-icon">
              PDF
            </div>

            <h2>Loading your PDF...</h2>

            <p>
              Your converted document will appear here.
            </p>

          </div>

        </div>

      </div>

    </main>

  </div>


  <div class="mobile-actions">

    <button id="mobileEmail">
      Email
    </button>

    <button id="mobilePrint">
      Print
    </button>

    <button id="mobileDownload">
      Download
    </button>

  </div>


  <script
    type="module"
    src="editor.js?v=2">
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PDF Editor | WordPDF</title>

  <link rel="stylesheet" href="editor.css">
</head>

<body>

  <header class="editor-header">

    <div class="brand">
      <span class="brand-icon">↔</span>
      WordPDF
    </div>

    <div class="document-name" id="documentName">
      Converted Document.pdf
    </div>

    <div class="header-actions">

      <button id="emailButton">
        Email
      </button>

      <button id="printButton">
        Print
      </button>

      <button id="downloadButton" class="primary-button">
        Download
      </button>

    </div>

  </header>


  <div class="editor-layout">

    <!-- EDITING TOOLS -->

    <aside class="toolbar">

      <button class="tool-button">
        <span>↖</span>
        Select
      </button>

      <button class="tool-button">
        <span>T</span>
        Text
      </button>

      <button class="tool-button">
        <span>✎</span>
        Draw
      </button>

      <button class="tool-button">
        <span>▰</span>
        Highlight
      </button>

      <button class="tool-button">
        <span>▧</span>
        Image
      </button>

      <button class="tool-button">
        <span>✍</span>
        Sign
      </button>

    </aside>


    <!-- DOCUMENT -->

    <main class="document-workspace">

      <div class="document-controls">

        <button id="zoomOut">
          −
        </button>

        <span id="zoomLevel">
          100%
        </span>

        <button id="zoomIn">
          +
        </button>

      </div>


      <div class="pdf-container">

        <div id="pdfViewer" class="pdf-viewer">

          <div class="empty-preview">

            <div class="document-icon">
              PDF
            </div>

            <h2>Your converted PDF will appear here</h2>

            <p>
              You'll be able to review and edit your
              document before downloading, printing,
              or emailing it.
            </p>

          </div>

        </div>

      </div>

    </main>

  </div>


  <!-- MOBILE ACTION BAR -->

  <div class="mobile-actions">

    <button id="mobileEmail">
      Email
    </button>

    <button id="mobilePrint">
      Print
    </button>

    <button id="mobileDownload">
      Download
    </button>

  </div>


  <script src="editor.js?v=1"></script>

</body>
</html>
